spring.application.name=email-service
server.port=8081

# =========================================================
# MAIL
# =========================================================

book-my-stay-mail=staymybook@gmail.com

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=staymybook@gmail.com
spring.mail.password=${GMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# =========================================================
# KAFKA SECURITY
# =========================================================


spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_USERNAME}' password='${KAFKA_PASSWORD}';

spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_LOCATION}

# =========================================================
# KAFKA CONSUMER
# =========================================================

spring.kafka.consumer.group-id=email-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

# =========================================================
# KAFKA PRODUCER
# =========================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false